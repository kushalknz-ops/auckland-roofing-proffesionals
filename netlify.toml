# Netlify configuration for Auckland Roof Professionals

[build]
  publish = "dist"
  command = "npm run build"

# Canonical redirects: www to apex domain
[[redirects]]
  from = "https://www.aucklandroofprofessionals.nz/*"
  to = "https://aucklandroofprofessionals.nz/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.aucklandroofprofessionals.nz/*"
  to = "https://aucklandroofprofessionals.nz/:splat"
  status = 301
  force = true

# Redirect HTTP to HTTPS
[[redirects]]
  from = "http://*"
  to = "https://aucklandroofprofessionals.nz/:splat"
  status = 301
  force = true

# Existing static files and the generated service rewrites take precedence.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# Security and cache headers are set by public/_headers (copied to dist).
