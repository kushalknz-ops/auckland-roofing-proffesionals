# Auckland Roof Professionals - Production Nginx Configuration
# Redirects HTTP to HTTPS & Serves Vite Static Single-Page App

# 1. HTTP Server - Redirect all port 80 traffic to HTTPS canonical domain
server {
    listen 80;
    listen [::]:80;
    server_name aucklandroofprofessionals.nz www.aucklandroofprofessionals.nz _;

    # Optional ACME challenge block for Let's Encrypt certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to canonical HTTPS domain (301 Moved Permanently)
    location / {
        return 301 https://aucklandroofprofessionals.nz$request_uri;
    }
}

# 2. HTTPS Server (www) - Redirect www to apex canonical domain
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.aucklandroofprofessionals.nz;

    ssl_certificate /etc/letsencrypt/live/aucklandroofprofessionals.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aucklandroofprofessionals.nz/privkey.pem;

    return 301 https://aucklandroofprofessionals.nz$request_uri;
}

# 3. HTTPS Server - Main Canonical Host & Static SPA Delivery
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name aucklandroofprofessionals.nz _;

    # SSL Certificates (update paths to match your certificate provider, e.g. Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), vr=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://aucklandroofprofessionals.nz https://res.cloudinary.com; media-src 'self' https://res.cloudinary.com blob:; connect-src 'self' https://res.cloudinary.com https://fonts.googleapis.com https://fonts.gstatic.com; frame-src 'self' https://www.google.com https://maps.google.com; frame-ancestors 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    root /var/www/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Immutable caching & CORS for Vite hashed assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;

        if ($request_method = 'OPTIONS') {
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Origin, Content-Type, Accept" always;
            add_header Access-Control-Max-Age 86400 always;
            add_header Content-Type 'text/plain charset=UTF-8';
            add_header Content-Length 0;
            return 204;
        }
    }

    # Strip trailing slashes on sub-paths for canonical URL consistency (e.g. /commercial/ -> /commercial)
    rewrite ^/(.+)/$ /$1 permanent;

    # Single Page Application fallback: any route goes to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
