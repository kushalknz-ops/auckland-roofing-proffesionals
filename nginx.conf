# Auckland Roof Professionals - Production Nginx Configuration
# Redirects HTTP to HTTPS & Serves Vite Static Single-Page App

# Keep cache headers at server scope so /assets/ inherits all security headers.
map $uri $roofing_asset_cache_control {
    default "";
    ~^/assets/ "public, max-age=31536000, immutable";
}

map $arg_id $roofing_service_html {
    "" /service-default.html;
    ~^[a-z0-9]+(?:-[a-z0-9]+)*$ /service/$arg_id.html;
    default /invalid-service-id.html;
}

# 1. HTTP Server - Redirect all port 80 traffic to HTTPS canonical domain
server {
    listen 80;
    server_tokens off;
    listen [::]:80;
    server_name aucklandroofprofessionals.nz www.aucklandroofprofessionals.nz _;

    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'none'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src https://res.cloudinary.com/avvuses1/video/upload/; connect-src 'self'; frame-src https://www.google.com/maps; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    # Optional ACME challenge block for Let's Encrypt certbot renewal
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all HTTP traffic to canonical HTTPS domain (301 Moved Permanently)
    location / {
        return 301 https://aucklandroofprofessionals.nz$request_uri;
    }
}

# 2. HTTPS Server (www) - Redirect www to apex canonical domain
server {
    listen 443 ssl http2;
    server_tokens off;
    listen [::]:443 ssl http2;
    server_name www.aucklandroofprofessionals.nz;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'none'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src https://res.cloudinary.com/avvuses1/video/upload/; connect-src 'self'; frame-src https://www.google.com/maps; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;

    ssl_certificate /etc/letsencrypt/live/aucklandroofprofessionals.nz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/aucklandroofprofessionals.nz/privkey.pem;

    return 301 https://aucklandroofprofessionals.nz$request_uri;
}

# 3. HTTPS Server - Main Canonical Host & Static SPA Delivery
server {
    listen 443 ssl http2;
    server_tokens off;
    listen [::]:443 ssl http2;
    server_name aucklandroofprofessionals.nz _;

    # SSL Certificates (update paths to match your certificate provider, e.g. Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

    # Modern TLS Security Parameters
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; script-src-attr 'none'; style-src 'self' https://fonts.googleapis.com; style-src-attr 'none'; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; media-src https://res.cloudinary.com/avvuses1/video/upload/; connect-src 'self'; frame-src https://www.google.com/maps; manifest-src 'self'; frame-ancestors 'none'; form-action 'self'; base-uri 'none'; object-src 'none'; upgrade-insecure-requests" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), display-capture=(), xr-spatial-tracking=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header X-XSS-Protection "0" always;
    add_header Cache-Control $roofing_asset_cache_control;

    root /var/www/html;
    index index.html;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Strip trailing slashes on sub-paths for canonical URL consistency (e.g. /commercial/ -> /commercial)
    rewrite ^/(.+)/$ /$1 permanent;

    error_page 404 /404.html;
    location = /service {
        error_page 404 /service-not-found.html;
        try_files $roofing_service_html =404;
    }

    location = /sitemap.xml {
        types { application/xml xml; }
        charset utf-8;
        try_files $uri =404;
    }

    location / {
        try_files $uri.html $uri $uri/ =404;
    }

    # Deny access to hidden files (except .well-known)
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
